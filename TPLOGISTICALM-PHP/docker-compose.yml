services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${MARIADB_DATABASE:-tplogisticalm}
      DB_USER: ${MARIADB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in your local .env file}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tplogisticalm}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in your local .env file}
    depends_on:
      db:
        condition: service_healthy
volumes:
  mariadb_data:
